<body class="bg-background font-body-md text-on-surface selection:bg-primary-fixed">
<main class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-margin py-xl">
<!-- Decorative Background Elements -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary-fixed/10 rounded-full blur-3xl -mr-32 -mt-32"></div>
<div class="absolute bottom-0 left-0 w-80 h-80 bg-primary-fixed/5 rounded-full blur-3xl -ml-40 -mb-40"></div>
<!-- Header Invocation -->
<header class="text-center mb-xl max-w-md">
<h2 class="font-headline-md text-label-caps text-primary tracking-[0.2em] leading-relaxed mb-sm uppercase" style="">
                ATAS BERKAT ROCHMAT ALLOH YANG MAHA KUASA
            </h2>
</header>
<!-- Brand Logo -->
<div class="mb-lg">
<img alt="MQ Mobile Gold Logo" class="w-32 h-32 object-contain filter drop-shadow-sm w-40 h-40" src="https://lh3.googleusercontent.com/aida/ADBb0uiF9Y2kGHAUV17wE_Tv4WmvYgHfmPoDyH3hkh-a94mZxLm-4rkUOKWGEMu3I9c_ptJxMZyvTBwzkVOGIqxEqQp-aVThc9Nc2DPVuLN5LWiUb4vlnHMAMM9ufqozDABrqcWLQuO2Dx8_QHkrSEjvrx36YgpeL7TET90yfzBmUaVbP4Q0cUGk1VqPv4xhMa-bZmX5gdkTsobgCZz4wI2EDhP295qn6amLGcgWiNX0nCvlNoY7_N103ZIPWx3NBpoU-mBsOKKgubAixOo" style="">
</div>
<!-- Welcome Text -->
<div class="text-center mb-xxl">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs" style="">Selamat Datang di MQ-13 Mobile</h1>
<p class="font-body-md text-tertiary" style="">Melayani Kamu di Segala Bidang</p>
</div>
<!-- Login Form Container -->
<section class="w-full max-w-[400px] glass-panel p-lg rounded-xl shadow-[0_10px_40px_rgba(212,175,55,0.08)]">
<form action="#" class="space-y-xl" method="POST">
<!-- Username Field -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-primary mb-xs uppercase" for="username" style="">Username</label>
<div class="flex items-center gold-border-bottom focus-within:border-primary-container transition-all">
<span class="material-symbols-outlined text-outline-variant mr-sm" style="font-variation-settings: &quot;FILL&quot; 0;">person</span>
<input class="w-full py-sm bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-outline-variant" id="username" name="username" placeholder="Masukkan username" type="text">
</div>
</div>
<!-- Password Field -->
<div class="relative">
<div class="flex justify-between items-end mb-xs">
<label class="block font-label-caps text-label-caps text-primary uppercase" for="password" style="">Password</label>
<a class="text-[11px] font-label-caps text-outline hover:text-primary transition-colors" href="#" style="">Lupa Password?</a>
</div>
<div class="flex items-center gold-border-bottom focus-within:border-primary-container transition-all">
<span class="material-symbols-outlined text-outline-variant mr-sm" style="font-variation-settings: &quot;FILL&quot; 0;">lock</span>
<input class="w-full py-sm bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password">
<button class="text-outline-variant hover:text-primary transition-colors" style="" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full metallic-gold py-md rounded-lg shadow-lg hover:shadow-xl active:scale-[0.98] transition-all transform duration-200" style="" type="submit">
<span class="font-label-caps text-white text-md uppercase tracking-widest font-bold" style="">Masuk</span>
</button>
</form>
<!-- Biometric / Secondary Action -->
<div class="mt-lg pt-lg border-t border-outline-variant/20 flex flex-col items-center gap-md">
<button class="flex items-center text-primary hover:text-secondary transition-colors group" style="">
<span class="font-label-caps text-[11px] uppercase tracking-wider" style=""><br></span>
</button>
</div>
</section>
<!-- Footer Decoration/Info -->
<footer class="mt-xxl text-center">
<div class="flex items-center justify-center gap-xs mb-sm">
<span class="h-[1px] w-8 bg-primary-container/30"></span>

<span class="h-[1px] w-8 bg-primary-container/30"></span>
</div>
<p class="font-body-md text-[12px] text-tertiary-fixed-dim" style="">
                Terdaftar dan diawasi oleh Pengurus MQ-13</p>
</footer>

<!-- Visual Polish: Top and Bottom Accent Lines -->
<div class="fixed top-0 left-0 w-full h-1 metallic-gold opacity-50"></div>
<div class="fixed bottom-0 left-0 w-full h-1 metallic-gold opacity-50"></div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbwV2CrkIVXwJS1KSubggnso6XhCbQCUQ5gP_Ui3oTZRi3Qwx57P1WtGiefNTUQlM0fv/exec';
const loginForm = document.querySelector('form');

loginForm.addEventListener('submit', e => {
  e.preventDefault();
  const usernameInput = document.getElementById('username').value;
  const passwordInput = document.getElementById('password').value;

  fetch(`${scriptURL}?nama=${usernameInput}`)
    .then(response => response.json())
    .then(data => {
      if (data.status === "success" && data.password == passwordInput) {
        // Simpan data ke memori browser
        localStorage.setItem('userLogin', JSON.stringify(data));
        // Pindah ke halaman menu utama
        window.location.href = 'main_menu.html';
      } else {
        alert("Username atau Password salah!");
      }
    });
});
</script>
