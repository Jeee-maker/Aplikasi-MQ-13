<script>
  // Ambil data dari localStorage
  const userData = JSON.parse(localStorage.getItem('userLogin'));

  if (!userData) {
    window.location.href = 'index.html'; // Tendang balik jika belum login
  } else {
    // Update tampilan nama
    document.getElementById('user-display').innerText = userData.nama;
    
    // Update tampilan tunggakan dengan format Rupiah
    const nominal = new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      minimumFractionDigits: 0
    }).format(userData.tunggakan);
    
    document.getElementById('tunggakan-display').innerText = nominal;
  }
</script>
